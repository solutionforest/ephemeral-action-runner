github:
  appId: 123456
  organization: your-org
  privateKeyPath: ~/.config/ephemeral-action-runner/github-app.pem
  apiBaseUrl: https://api.github.com
  webBaseUrl: https://github.com

image:
  # local-build is the new-wizard default; use prebuilt only with EPAR's verified Act reference.
  distribution: local-build
  sourceType: docker-image
  sourceImage: ghcr.io/catthehacker/ubuntu:full-latest
  sourcePlatform: linux/amd64
  runnerVersion: latest
  updateFrequency: weekly
  updateTime: "07:00"
  customInstallScripts:
    # - examples/custom-install/install-extra-apt-tools.sh
  hostTrustMode: overlay
  hostTrustScopes: [system]

pool:
  instances: 1
  namePrefix: change-me-docker-sandboxes

storage:
  minimumFree: 1GiB
  gracePeriod: 168h
  keepPrevious: 0
  automaticHousekeeping: conservative
  buildCacheLimit: 20GiB
  goCacheLimit: 10GiB

runner:
  group: your-runner-group
  # On Apple Silicon, replace X64 with ARM64 when provider.platform is linux/arm64.
  labels: [self-hosted, linux, X64, epar-docker-sandboxes]
  includeHostLabel: true
  ephemeral: true

security:
  runnerGroup:
    enforcement: enforce
    requireExplicitGroup: true
    requireNonDefaultGroup: true
    requiredRepositoryAccess: selected
    requirePublicRepositoriesDisabled: true

provider:
  type: docker-sandboxes
  # Exact host mapping: Windows/Linux amd64 -> linux/amd64; macOS arm64 -> linux/arm64.
  platform: linux/amd64

dockerSandboxes:
  # The wizard reads and records the exact active host-global policy fingerprint.
  policyGeneration: sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  networkBaseline: open
  # best-effort attempts bundled QEMU/binfmt, then continues with a warning when the sandbox supports native containers only.
  # Use required only when every runner must execute foreign-architecture containers.
  architectureEmulation: best-effort
  additionalAllow:
    - api.github.com
    - '*.githubusercontent.com:443'
  additionalDeny:
    - telemetry.example.invalid
  stagingRoot: .local/docker-sandboxes-staging
  cpus: 4
  memory: 8GiB
  # EPAR derives this sparse logical maximum from the selected image and stores the effective size in the active artifact receipt.
  rootDisk: auto
  # Independent sparse workload capacity for Docker inside the sandbox.
  dockerDisk: 50GiB
  maxConcurrentCreates: 2

timeouts:
  bootSeconds: 180
  githubOnlineSeconds: 180
  commandSeconds: 900
